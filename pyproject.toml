[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rough-heston-pinn"
version = "0.1.0"
description = "Calibrating the Rough Heston model to option surfaces with a physics-informed neural network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paarth Agrawal" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["rough_heston_pinn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
